name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check backend/ tests/
      - name: Contract & integration tests
        run: python -m pytest tests/ -q
        env:
          # tests must never need real credentials; set dummies to prove it
          GOOGLE_CLOUD_PROJECT: ci-test-project

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: node --check frontend/app.js
      - name: Export/map smoke tests
        run: node tests/test_frontend_exports.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          # placeholder strings (AIzaSy...) are only allowed in docs as obvious examples
          if grep -rInE "AIzaSy[A-Za-z0-9_-]{30,}|sk-or-v1-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" \
             --include="*.py" --include="*.js" --include="*.html" --include="*.json" --include="*.toml" --include="*.yml" --include="*.yaml" \
             --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Potential credential committed"; exit 1
          fi
          echo "No secrets found."
      - name: Assert no .env with real values committed
        run: |
          if git ls-files --error-unmatch 'backend/.env' 2>/dev/null; then
            echo "::error::backend/.env must never be tracked"; exit 1
          fi
          echo "OK — no tracked .env."
